# InternLite — Render Blueprint (one-click backend deploy)
# Docs: https://render.com/docs/blueprint-spec
# Steps: Render Dashboard → New → Blueprint → select this repo.
# Then fill the env vars below (values marked sync:false must be set manually).
services:
  - type: web
    name: internlite-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: JPA_DDL_AUTO
        value: update
      # --- Render PostgreSQL (Render → PostgreSQL → Connect → Internal Database URL) ---
      # DB_URL accepts either jdbc:postgresql://... or the raw postgresql://... URL.
      - key: DB_URL
        sync: false # e.g. jdbc:postgresql://dpg-xxxx-a:5432/internlite
      - key: DB_USERNAME
        sync: false # e.g. internlite_user
      - key: DB_PASSWORD
        sync: false
      # --- CORS: your Vercel URL (comma-separated if multiple) ---
      - key: FRONTEND_URL
        sync: false # e.g. https://internlite.vercel.app
      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true # 256-bit+ random; or paste your own (min 32 chars)
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # --- Mail ---
      # NOTE: Render FREE tier blocks outbound SMTP (ports 25/465/587), so
      # Gmail SMTP only works locally. For OTP email on Render, create a free
      # Brevo account (brevo.com) → verify your Gmail under Senders →
      # SMTP & API → API Keys → paste the key below (sync: false).
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: no-reply@internlite.com
      - key: MAIL_FROM_NAME
        value: InternLite
      - key: MAIL_REPLY_TO
        value: no-reply@internlite.com
      - key: BREVO_API_KEY
        sync: false # free Brevo key — enables HTTPS email on the free tier
      # --- External job ingestion (PUBLIC boards — no API keys needed) ---
      # Change board lists from the Render dashboard without a code push.
      - key: GREENHOUSE_TOKENS
        sync: false # e.g. stripe,coinbase,airbnb
      - key: LEVER_SLUGS
        sync: false # e.g. portcast
      - key: ASHBY_BOARDS
        sync: false # e.g. linear,openai
      - key: WORKABLE_ACCOUNTS
        sync: false # e.g. runware,activtrak
      - key: SMARTRECRUITERS_COMPANIES
        sync: false # e.g. smartrecruiters
      - key: RECRUITEE_COMPANIES
        sync: false # e.g. vandebron
      - key: OPENINTERN_LIMIT
        value: 200

  # --- Frontend (Vite static site; rewrite keeps React Router routes working) ---
  - type: web
    name: internlite-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://internlite-backen.onrender.com/api
