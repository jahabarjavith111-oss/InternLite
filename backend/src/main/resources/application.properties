# InternLite — production-ready config.
# Values can be overridden by environment variables in Render or local runs.

# --- Database (Render PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/internlite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Server (Render provides PORT; default kept for local runs) ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- CORS ---
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:internlite_jwt_secret_key_minimum_256_bits_long_2024}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Mail (SMTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abduljahabar10@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xwapjiuiucjqzdxd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@internlite.com}
app.mail.from-name=${MAIL_FROM_NAME:InternLite}
app.mail.reply-to=${MAIL_REPLY_TO:no-reply@internlite.com}

# --- Actuator health (Render health checks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
