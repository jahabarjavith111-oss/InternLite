# InternLite — production-ready config.
# Every value can be overridden by an environment variable (Render / Railway / local).
# Local defaults keep `mvn spring-boot:run` working with zero setup.

# --- Database (Railway MySQL in prod) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internlite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql26}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Server (Render injects $PORT) ---
server.port=${PORT:8082}
server.forward-headers-strategy=framework

# --- CORS (comma-separated; set to your Vercel URL in prod) ---
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:internlite_jwt_secret_key_minimum_256_bits_long_2024}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Mail (Gmail SMTP for OTP; leave empty to run in dev-log mode) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abduljahabar10@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xwapjiuiucjqzdxd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@internlite.com}
app.mail.from-name=${MAIL_FROM_NAME:InternLite}
app.mail.reply-to=${MAIL_REPLY_TO:no-reply@internlite.com}

# --- Actuator health (used by Render health check) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
